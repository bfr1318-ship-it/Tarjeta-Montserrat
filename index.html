<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Tarjeta digital de Montserrat Momán Pampillo, Directora de Fundación España África.">
  <title>Montserrat Momán Pampillo · Fundación España África</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <div class="arc arc-top-yellow" aria-hidden="true"></div>
    <div class="arc arc-top-red" aria-hidden="true"></div>
    <div class="arc arc-top-blue" aria-hidden="true"></div>
    <div class="arc arc-bottom-green" aria-hidden="true"></div>
    <div class="arc arc-bottom-red" aria-hidden="true"></div>
    <div class="arc arc-bottom-blue" aria-hidden="true"></div>
    <div class="arc arc-bottom-ochre" aria-hidden="true"></div>

    <section class="card" aria-label="Tarjeta digital de Montserrat Momán Pampillo">
      <header class="brand">
        <img src="assets/logo.png" alt="Fundación España África" class="logo">
      </header>

      <section class="identity">
        <h1>Montserrat Momán Pampillo</h1>
        <p class="role">Directora</p>
        <p class="org">Fundación España África</p>
      </section>

      <section class="details">
        <a class="detail" href="https://www.openstreetmap.org/search?query=Pl.%20del%20Marqu%C3%A9s%20de%20Salamanca%208%2C%2028006%20Madrid%2C%20Espa%C3%B1a" target="_blank" rel="noopener">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/></svg>
          </span>
          <span>Pl. del Marqués de Salamanca, 8<br>2º Planta, Despacho A.02.45<br>28006 Madrid, España</span>
        </a>

        <a class="detail" href="tel:+34654761589">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.8-.4 1.2-.2 1.3.5 2.6.8 4 .8.7 0 1.2.5 1.2 1.2v3.5c0 .7-.5 1.2-1.2 1.2C10.4 21.7 2.3 13.6 2.3 3.4c0-.7.5-1.2 1.2-1.2H7c.7 0 1.2.5 1.2 1.2 0 1.4.3 2.8.8 4 .1.4 0 .9-.3 1.2l-2.1 2.2Z"/></svg>
          </span>
          <span>+34 654 76 15 89</span>
        </a>

        <a class="detail" href="mailto:montserrat.moman@maec.es">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M2 5.5A2.5 2.5 0 0 1 4.5 3h15A2.5 2.5 0 0 1 22 5.5v13a2.5 2.5 0 0 1-2.5 2.5h-15A2.5 2.5 0 0 1 2 18.5v-13Zm2.4-.5L12 11l7.6-6H4.4ZM20 7.1l-7.4 5.8a1 1 0 0 1-1.2 0L4 7.1v11.4c0 .3.2.5.5.5h15c.3 0 .5-.2.5-.5V7.1Z"/></svg>
          </span>
          <span>montserrat.moman@maec.es</span>
        </a>
      </section>

      <section class="actions" aria-label="Acciones">
        <a class="primary" href="montserrat-moman.vcf" download>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a1 1 0 0 1 1 1v8.6l2.3-2.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.4l2.3 2.3V4a1 1 0 0 1 1-1Zm-7 14a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z"/></svg>
          Guardar contacto
        </a>
        <button id="shareBtn" class="secondary" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16a3 3 0 0 0-2.4 1.2L8.9 13.8a3.1 3.1 0 0 0 0-3.6l6.7-3.4A3 3 0 1 0 15 5c0 .1 0 .2.1.3L8.4 8.7a3 3 0 1 0 0 6.6l6.7 3.4v.3a3 3 0 1 0 3-3Z"/></svg>
          Compartir
        </button>
        <button id="installBtn" class="secondary install" type="button" hidden>
          Añadir al móvil
        </button>
      </section>

      <figure class="qr-wrap">
        <img src="assets/qr.png" alt="Código QR de contacto de Montserrat Momán Pampillo" class="qr">
      </figure>

      <p id="installHint" class="hint">En iPhone: Compartir → Añadir a pantalla de inicio.</p>
    </section>
  </main>

  <script>
    const shareBtn = document.getElementById('shareBtn');
    shareBtn.addEventListener('click', async () => {
      const shareData = {
        title: 'Montserrat Momán Pampillo · Fundación España África',
        text: 'Tarjeta de contacto de Montserrat Momán Pampillo, Directora de Fundación España África.',
        url: window.location.href
      };
      try {
        if (navigator.share) await navigator.share(shareData);
        else {
          await navigator.clipboard.writeText(window.location.href);
          shareBtn.textContent = 'Enlace copiado';
          setTimeout(() => shareBtn.textContent = 'Compartir', 1800);
        }
      } catch (_) {}
    });

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.hidden = false;
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
